name: Publish v0.6.1

on:
  push:
    branches: [main]
    paths:
      - '.release-bootstrap/manifest.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bootstrap trigger
        shell: bash
        run: test -f .release-bootstrap/manifest.txt

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release-bootstrap/source-part-* \
            | base64 --decode \
            > "$RUNNER_TEMP/v061-source.tar.xz"
          echo "7c2a7833123d7b6eeb9821f568bd098e311b60128b6fc72e506bf9c7f11dc129  $RUNNER_TEMP/v061-source.tar.xz" \
            | sha256sum -c -

      - name: Materialize complete source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/unpacked"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xJf "$RUNNER_TEMP/v061-source.tar.xz" -C "$RUNNER_TEMP/unpacked"
          source_root="$RUNNER_TEMP/unpacked/epoch_voxel_live_ray_inspector_child_v061"
          test -f "$source_root/CMakeLists.txt"
          test -f "$source_root/src/main_vulkan.cpp"
          test -f "$source_root/src/ray_inspector.cpp"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            "$source_root/" ./
          rm -rf .release-bootstrap

      - name: Commit complete v0.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish VoxelRayBenchmark v0.6.1"
          git push origin HEAD:main

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/VoxelRayBenchmark-v0.6.1"
          mkdir -p "$release_dir"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ "$release_dir/"
          cd "$RUNNER_TEMP"
          zip -qr VoxelRayBenchmark-v0.6.1-source.zip VoxelRayBenchmark-v0.6.1
          sha256sum VoxelRayBenchmark-v0.6.1-source.zip \
            > VoxelRayBenchmark-v0.6.1-source.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          {
            echo "Standalone C++23 Vulkan/OpenGL compute benchmark comparing global BVH traversal with unified brick DDA and brick-local micro-BVH traversal."
            echo
            cat CHANGES_0.6.1.md
            echo
            echo "## Validation note"
            echo
            echo "The published source archive was reconstructed from SHA-256-verified repository payload data. Native Windows MSVC/Vulkan runtime validation remains hardware-dependent."
          } > "$RUNNER_TEMP/release-notes.md"

          if gh release view v0.6.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.6.1 \
              "$RUNNER_TEMP/VoxelRayBenchmark-v0.6.1-source.zip" \
              "$RUNNER_TEMP/VoxelRayBenchmark-v0.6.1-source.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.6.1 \
              "$RUNNER_TEMP/VoxelRayBenchmark-v0.6.1-source.zip" \
              "$RUNNER_TEMP/VoxelRayBenchmark-v0.6.1-source.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$release_sha" \
              --title "VoxelRayBenchmark v0.6.1" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
